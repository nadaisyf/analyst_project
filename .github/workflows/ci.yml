name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest

    env:
      AUTH_SECRET: ${{ s64Ap42SxAVmYUXQfZ0nvgfze3TOGekquP/IwoCQWPd4= }}
      AUTH_DISCORD_ID: ${{ endee }}
      AUTH_DISCORD_SECRET: ${{ ende }}
      DATABASE_URL: ${{ postgresql://postgres:endeesye2106@localhost:5432/book_tracker }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:coverage

      - run: npm audit --audit-level=high || true

      - run: npm run build
